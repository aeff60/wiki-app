spring.application.name=wiki
server.port=${PORT:4000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wikidb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wikiuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:supersecret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${JWT_SECRET:changeme_changeme_changeme_changeme_changeme_changeme_changeme_changeme}
jwt.expires-in=${JWT_EXPIRES_IN:7d}
cors.allowed-origins=${CLIENT_URL:http://localhost:5173}
upload.dir=${UPLOAD_DIR:uploads}
logging.level.root=INFO
